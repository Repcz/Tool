    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/aristotle/query_order_list_tabs_element\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/aquarius/hungary/global/homepage\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/caterham/v3/query/order_express_group\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/search_hotquery\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/zaire_biz/chat/resource/get_list_data\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/caterham/v3/query/new_chat_group\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/alexa/goods/back_up\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/caterham/v3/query/personal\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/brand-olay/goods_detail/bybt_guide\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/engels/reviews/require/append\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/caterham/v3/query/my_order_group\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/caterham/v3/query/likes\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/phantom/gbdbpdv/extra\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/manufacturer/cross/shortcut/list\?'
    location: 'http://reject-dict/'
  - match: '(?i)^https://api\.pinduoduo\.com/api/dunkirk/liveactivity/push/create/url/report\?'
