name: '拼多多去广告'
description: |-
  移除开屏广告、底栏多多视频、会场入口、聊天页面精选推荐及推广，精简首页和个人中心。
  @ZenmoFeiShi, @可莉🅥
rules:
  - and:
      match:
        - url_regex:
            match: '"^http:\/\/((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\/d(\d)?"'
        - user_agent:
            match: '"*com.xunmeng.pinduoduo*"'
      policy: 'REJECT'
  - and:
      match:
        - url_regex:
            match: '"^http:\/\/\[[0-9a-fA-F:]+\]\/d(\d)?\?"'
        - user_agent:
            match: '"*com.xunmeng.pinduoduo*"'
      policy: 'REJECT'
  - and:
      match:
        - protocol:
            match: 'QUIC'
      policy: 'REJECT'
url_rewrites:
