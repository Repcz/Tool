name: 'IT之家去广告'
description: |-
  过滤IT之家信息流广告和文末广告，自定义移除置顶和轮播图，自定义移除项需在插件配置。
  @可莉🅥
compat_arguments:
  removePinnedArticles: 'false'
  removeAllBanners: 'false'
url_rewrites:
  - match: '(?i)^https?://dat\.ruanmei\.com/ithome/money/acd\.json$'
    location: 'http://reject/'
scriptings:
  - http_response:
      match: '(?i)^https://napi\.ithome\.com/api/(news/indexv2/iphone/\d+|topmenu/getfeeds\?)'
      name: 'IT之家去广告'
      script_url: 'https://raw.githubusercontent.com/Repcz/Tool/X/Loon/Script/IThome/IThome_remove_ads.js'
      body_required: true
mitm:
  hostnames:
    includes:
      - 'napi.ithome.com'
      - 'api.zuihuimai.com'
      - 'dat.ruanmei.com'
