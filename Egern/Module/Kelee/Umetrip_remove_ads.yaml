name: '航旅纵横去广告'
description: |-
  过滤航旅纵横广告
  @佚名
rules:
  - url_regex:
      match: '"^http?:\/\/(discardrp|startup)\.umetrip\.com\/gateway\/api\/umetrip\/native"'
      policy: 'REJECT'
scriptings:
  - http_response:
      match: '(?i)^http?://(114\.115\.217\.129)|(home\.umetrip\.com)/gateway/api/umetrip/native$'
      name: '移除首页广告'
      script_url: 'https://raw.githubusercontent.com/Repcz/Tool/X/Loon/Script/Umetrip/Umetrip_remove_ads.js'
mitm:
  hostnames:
    includes:
      - '114.115.217.129'
      - 'home.umetrip.com'
