name: 'HTTPDNS拦截器'
description: |-
  此插件是所有去广告插件的依赖，拦截常见的HTTPDNS服务，以确保这些请求都能够在Loon的DNS框架下工作。
  @可莉🅥, @VirgilClyne
rules:
  - user_agent:
      match: '"httpdns*"'
      policy: 'REJECT'
  - user_agent:
      match: '"httpsdns*"'
      policy: 'REJECT'
  - user_agent:
      match: '"Httpdns*"'
      policy: 'REJECT'
  - user_agent:
      match: '"Httpsdns*"'
      policy: 'REJECT'
  - and:
      match:
        - url_regex:
            match: '^http:\/\/119\.29\.29\.90\/d\?'
        - user_agent:
            match: '%E5%98%80%E5%97%92%E5%87%BA%E8%A1%8C*'
      policy: 'DIRECT'
  - and:
      match:
        - url_regex:
            match: '^http:\/\/119\.28\.28\.90\/d\?'
        - user_agent:
            match: '%E5%98%80%E5%97%92%E5%87%BA%E8%A1%8C*'
      policy: 'DIRECT'
  - url_regex:
      match: '"^http:\/\/((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\/v?[0-9]+)?\/(?:sign_)?(?:(?:d|ss)[46]?|resolve)\?"'
      policy: 'REJECT'
  - url_regex:
      match: '"^http:\/\/\[[0-9a-fA-F:]+\](?:\/v?[0-9]+)?\/(?:sign_)?(?:(?:d|ss)[46]?|resolve)\?"'
      policy: 'REJECT'
  - url_regex:
