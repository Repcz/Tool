name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点生成一次
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Repcz
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    runs-on: ubuntu-latest
    needs: generate
    if: always()
    timeout-minutes: 5
    steps:
      - name: Delete old workflow runs (keep latest 2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="snake.yml"
          RUNS=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 100 --json databaseId --jq '.[2:] | .[].databaseId')
          if [ -z "$RUNS" ]; then
            echo "No old workflow runs to delete"
            exit 0
          fi
          for id in $RUNS; do
            echo "Deleting workflow run: $id"
            gh run delete "$id" --repo "$REPO" || true
          done
          echo "Remaining runs:"
          gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 5
