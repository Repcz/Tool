<svg xmlns="http://www.w3.org/2000/svg" width="850" height="140" viewBox="0 0 850 140" role="img" aria-label="Repcz Tool">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22c55e">
        <animate attributeName="stop-color" values="#22c55e;#3178c6;#7c3aed;#22c55e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="848" height="138" rx="16" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  <rect x="1" y="1" width="848" height="138" rx="16" fill="url(#shine)"/>

  <!-- 左侧装饰点阵 -->
  <g fill="#3178c6" opacity="0.9">
    <circle cx="42" cy="46" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="62" cy="46" r="4" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="82" cy="46" r="4" opacity="0.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="42" cy="70" r="4" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="62" cy="70" r="4" fill="#7c3aed"><animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="82" cy="70" r="4" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="42" cy="94" r="4" opacity="0.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="62" cy="94" r="4" fill="#22c55e" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="82" cy="94" r="4" opacity="0.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 主标题 -->
  <text x="128" y="66" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="700" fill="#e6edf3">
    Repcz / Tool
  </text>
  <!-- 下划线动画 -->
  <rect x="128" y="76" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- 副标题 -->
  <text x="128" y="106" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15" fill="#8b949e">
    代理规则 · 自动化构建 · 多平台分发
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- 右侧状态灯 -->
  <g transform="translate(770,44)">
    <circle cx="0" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#22c55e" stroke-opacity="0.4">
      <animate attributeName="r" values="8;16" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="-8" y="34" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b949e">AUTO</text>
  </g>
</svg>
